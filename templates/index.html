<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hello World Page</title>
</head>
<body>
    <h1> Courses:</h1>
    
    {% for course in courses %}
    <h2>{{ course }}</h2>
    <h2>{{loop.index0}}. {{ course }}</h2>  {# loop.index is used to get the index of the current iteration in the loop. It starts from 1. #}
    {% endfor %}

    <hr>    
    {% for key,value in student.items() %}
    <li>{{key}}: {{value}}</li>
    {% endfor %}    

    
</body>
</html>
